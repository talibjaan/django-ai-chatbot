{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | AI Assistant</title>

    <link
        rel="stylesheet"
        href="{% static 'chat/style.css' %}"
    >

</head>


<body class="auth-page">


    <div class="auth-container">

        <div class="auth-card">


            <!-- LOGO -->

            <div class="auth-logo">

                <div class="auth-logo-icon">
                    AI
                </div>

            </div>


            <!-- HEADING -->

            <h1>
                Create Account
            </h1>


            <!-- SUBTITLE -->

            <p class="auth-subtitle">
                Create your account and start chatting with AI.
            </p>


            <!-- ERROR / SUCCESS MESSAGES -->

            {% if messages %}

                {% for message in messages %}

                    <div class="auth-message
                        {% if message.tags %}
                            {{ message.tags }}
                        {% endif %}
                    ">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}


            <!-- REGISTER FORM -->

            <form
                method="POST"
                class="auth-form"
            >

                {% csrf_token %}


                <!-- USERNAME -->

                <div class="auth-field">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="auth-field">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="auth-field">

                    <label for="password">

                        Password

                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="auth-field">

                    <label for="password2">

                        Confirm Password

                    </label>

                    <input
                        type="password"
                        id="password2"
                        name="password2"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="auth-button"
                >

                    Create Account

                </button>


            </form>


            <!-- FOOTER -->

            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>


            <!-- HOME LINK -->

            <div class="auth-footer auth-home-link">

                <a href="{% url 'home' %}">
                    ← Back to AI Assistant
                </a>

            </div>


        </div>

    </div>


</body>

</html>
